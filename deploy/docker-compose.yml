# Full stack in containers (TRD 01 §1): postgres, ollama (LLM on the GPU + embeddings), ai (STT on the GPU, TTS),
# app (API + WebRTC), worker, runner (code sandbox through the host Docker daemon) and web (SPA + /api proxy).
#
#   cd deploy
#   copy .env.example .env            (Windows; Linux: cp)   then edit if needed
#   docker compose up -d --build
#   open http://localhost:8080
#
# First start downloads the models (Ollama ~4 GB, Whisper large-v3-turbo ~1.6 GB, Supertonic) into volumes; see
# deploy/README.md to reuse the copies already on this PC instead. Redis carries the AI job queue hand-off and the
# real-time screen notifications (ADR-0013); PostgreSQL stays the durable record, so Redis needs no persistence.
name: aihire

x-backend-env: &backend-env
  AIHIRE_ENV: dev
  AIHIRE_DATABASE_URL: postgresql+asyncpg://aihire:${POSTGRES_PASSWORD:-aihire_dev_only}@postgres:5432/aihire
  AIHIRE_DATA_DIR: /data
  AIHIRE_AI_SERVICE_URL: http://ai:8200
  AIHIRE_AI_TOKEN: ${AI_TOKEN:-dev-ai-token-change-me}
  AIHIRE_REDIS_URL: redis://redis:6379/0
  AIHIRE_RUNNER_URL: http://runner:8400
  AIHIRE_RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token-change-me}
  AIHIRE_CODE_EXECUTION_ENABLED: "true"
  AIHIRE_TRUSTED_ORIGINS: '${TRUSTED_ORIGINS:-["http://localhost:8080", "http://127.0.0.1:8080"]}'

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  postgres:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 + pgvector (migration 0004)
    environment:
      POSTGRES_DB: aihire
      POSTGRES_USER: aihire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihire_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihire -d aihire"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Everything in Redis can be rebuilt from PostgreSQL (ADR-0013): no snapshots, no AOF.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: { context: ../backend, target: app, secrets: [build_ca] }
    image: aihire-backend:dev
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  ollama:
    <<: *gpu
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama_models}:/root/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-pull:  # one-shot: makes sure both models are present (no-op when they already are)
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${LLM_MODEL:-qwen3.5:4b} && ollama pull ${EMBED_MODEL:-qwen3-embedding:0.6b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  ai:
    <<: *gpu
    build: { context: ../backend, target: ai, secrets: [build_ca] }
    image: aihire-ai:dev
    environment:
      AIHIRE_ENV: dev
      AIHIRE_AI_SERVICE_URL: http://0.0.0.0:8200  # bind address inside the container
      AIHIRE_AI_TOKEN: ${AI_TOKEN:-dev-ai-token-change-me}
      AIHIRE_OLLAMA_URL: http://ollama:11434
      AIHIRE_LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      AIHIRE_EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
      AIHIRE_STT_DEVICE: ${STT_DEVICE:-cuda}
      AIHIRE_GPU_POLICY: ${GPU_POLICY:-shared}
      AIHIRE_MODEL_AUTO_DOWNLOAD: ${MODEL_AUTO_DOWNLOAD:-true}
    volumes:
      - ${MODEL_CACHE_DIR:-model_cache}:/root/.cache  # huggingface/ (Whisper) and supertonic3/
    healthcheck:  # ready = LLM warm on the GPU and STT loaded
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15m  # first start downloads the speech models
      retries: 6
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    restart: unless-stopped

  runner:
    build: { context: ../runner, secrets: [build_ca] }
    image: aihire-runner:dev
    environment:
      RUNNER_ENV: dev
      RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token-change-me}
    volumes:
      # The runner is the only container with the Docker socket (TRD 07 §13.1); sandboxes get none of it.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8400), 3)"]
      interval: 5s
      timeout: 5s
      start_period: 5m  # first start builds the sandbox image
      retries: 12
    restart: unless-stopped

  app:
    image: aihire-backend:dev
    environment:
      <<: *backend-env
      # WebRTC from a container (app/voice/netcfg.py): fixed UDP range, published below, and the addresses the
      # browser should use. 127.0.0.1 = a browser on this PC; add this PC's LAN IP in .env for other PCs.
      # The range must match the published ports below (one port per live session).
      AIHIRE_RTC_UDP_PORT_MIN: "40000"
      AIHIRE_RTC_UDP_PORT_MAX: "40019"
      AIHIRE_RTC_ANNOUNCE_IPS: '${RTC_ANNOUNCE_IPS:-["127.0.0.1"]}'
    ports:
      - "40000-40019:40000-40019/udp"
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      ai: { condition: service_started }
      runner: { condition: service_started }
    restart: unless-stopped

  worker:
    image: aihire-backend:dev
    command: ["python", "-m", "app.jobs.runtime"]
    environment: *backend-env
    volumes:
      - appdata:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ../frontend, secrets: [build_ca] }
    image: aihire-web:dev
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

secrets:
  build_ca:  # extra CA for image builds behind a TLS-inspecting proxy; the default file is empty
    file: ${BUILD_CA_FILE:-./empty-ca.pem}

volumes:
  pgdata:
  appdata:  # resumes, answer audio, TTS cache (shared by app and worker)
  ollama_models:
  model_cache:
