# Whole platform on one PC (target container diagram, ADR-0014). NVIDIA Container Toolkit / Docker Desktop GPU.
#
#   1) models:  ..\.venv\Scripts\python ..\backend\scripts\prepare_models.py --out ..\models   (once, with internet)
#   2) cd deploy && copy .env.example .env && docker compose up -d --build
#   3) open http://localhost:8080
#
# Networks
#   internal  internal: true - no route out. Every service sits here; the AI containers only read ../models.
#   front     carries the published ports (frontend, api). Ports are bound to 127.0.0.1 only.
#   egress    the only way out, used by `mailer` alone (Gmail relay on the reference PC).
# The code sandbox is not a service: the worker starts one container per run through docker.sock (network none).
name: aihire

x-backend-env: &backend-env
  AIHIRE_ENV: dev
  AIHIRE_DATABASE_URL: postgresql+asyncpg://aihire:${POSTGRES_PASSWORD:-aihire_dev_only}@postgres:5432/aihire
  AIHIRE_REDIS_URL: redis://redis:6379/0
  AIHIRE_WORKER_MODE: celery
  AIHIRE_AI_MODE: ${AI_MODE:-direct}
  AIHIRE_AI_TOKEN: ${AI_TOKEN:-dev-ai-token-change-me}
  AIHIRE_LLM_RT_URL: http://llm-rt:8080
  AIHIRE_LLM_EVAL_URL: http://llm-eval:8080
  AIHIRE_EMBED_URL: http://embed:8080
  AIHIRE_STT_URL: http://stt:8201
  AIHIRE_TTS_URL: http://tts:8202
  AIHIRE_LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
  AIHIRE_EMBED_MODEL: bge-m3
  AIHIRE_STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  AIHIRE_S3_ENDPOINT: minio:9000
  AIHIRE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-aihire}
  AIHIRE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-secret-change-me}
  AIHIRE_S3_BUCKET: aihire
  AIHIRE_MAIL_ENABLED: "true"
  AIHIRE_SMTP_HOST: mailer
  AIHIRE_SMTP_PORT: "1025"
  AIHIRE_MAIL_FROM: ${MAIL_FROM:-no-reply@aihire.local}
  AIHIRE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  AIHIRE_CODE_EXECUTION_ENABLED: "true"
  AIHIRE_TRUSTED_ORIGINS: '${TRUSTED_ORIGINS:-["http://localhost:8080", "http://127.0.0.1:8080"]}'
  AIHIRE_DATA_DIR: /data

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-backend-build: &backend-build
  context: ../backend
  additional_contexts:
    runner: ../runner
  secrets: [build_ca]

x-llama-health: &llama-health
  test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/health || exit 1"]
  interval: 10s
  timeout: 5s
  start_period: 5m
  retries: 6

services:
  # ── edge ──────────────────────────────────────────────────────────────────
  frontend:
    build: { context: ../frontend, secrets: [build_ca], args: { API_ORIGIN: "http://api:8000" } }
    image: aihire-frontend:dev
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3000"
    networks: [front]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { <<: *backend-build, target: app }
    image: aihire-api:dev
    environment:
      <<: *backend-env
      AIHIRE_RUNNER_MODE: celery  # no docker.sock here: [실행] goes to the worker
      # WebRTC from a container (app/voice/netcfg.py): fixed UDP range + the address the browser reaches.
      AIHIRE_RTC_UDP_PORT_MIN: "40000"
      AIHIRE_RTC_UDP_PORT_MAX: "40019"
      AIHIRE_RTC_ANNOUNCE_IPS: '${RTC_ANNOUNCE_IPS:-["127.0.0.1"]}'
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:40000-40019:40000-40019/udp"
    volumes: [ "appdata:/data" ]
    networks: [front, internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy, required: false }  # off when STORAGE_BACKEND=local
    restart: unless-stopped

  mailer:
    # Mailpit: team PCs keep every mail in its inbox (UI on http://127.0.0.1:8025); on the reference PC the
    # MAIL_RELAY_* values in .env relay every mail to Gmail (app password).
    image: axllent/mailpit:${MAILPIT_TAG:-latest}
    environment:
      MP_SMTP_RELAY_HOST: ${MAIL_RELAY_HOST:-}
      MP_SMTP_RELAY_PORT: ${MAIL_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: ${MAIL_RELAY_STARTTLS:-true}
      MP_SMTP_RELAY_AUTH: ${MAIL_RELAY_AUTH:-plain}
      MP_SMTP_RELAY_USERNAME: ${MAIL_RELAY_USERNAME:-}
      MP_SMTP_RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:-}
      MP_SMTP_RELAY_ALL: ${MAIL_RELAY_ALL:-false}
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal, egress]
    restart: unless-stopped

  # ── jobs ──────────────────────────────────────────────────────────────────
  migrate:
    image: aihire-api:dev
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *backend-env
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  worker:
    build: { <<: *backend-build, target: worker }
    image: aihire-worker:dev
    environment:
      <<: *backend-env
      AIHIRE_RUNNER_MODE: local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # only the worker: it starts the sandbox containers
      - appdata:/data
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy, required: false }  # off when STORAGE_BACKEND=local
    restart: unless-stopped

  scheduler:
    image: aihire-worker:dev
    command: ["celery", "-A", "app.celery_app", "beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    environment: *backend-env
    networks: [internal]
    depends_on:
      worker: { condition: service_started }
    restart: unless-stopped

  # ── AI (models read-only from ../models, prepared by backend/scripts/prepare_models.py) ──
  llm-rt:
    <<: *gpu
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_CUDA_TAG:-server-cuda}
    command: ["-m", "/models/llm/qwen3.5-4b.gguf", "--host", "0.0.0.0", "--port", "8080", "--jinja",
              "-c", "${LLM_RT_CTX:-16384}", "--parallel", "2", "-ngl", "99", "--alias", "${LLM_MODEL:-qwen3.5:4b}"]
    # The image has no prebuilt kernels for older GPUs (GTX 16xx, sm_75): the driver compiles them on first use,
    # 1-2 min that made every follow-up decision time out after a fresh start. Keep the compiled kernels.
    environment:
      CUDA_CACHE_PATH: /cuda-cache
      CUDA_CACHE_MAXSIZE: "4294967296"
    volumes: [ "../models:/models:ro", "cudacache:/cuda-cache" ]
    networks: [internal]
    healthcheck:
      <<: *llama-health
      # Healthy only after one real prompt, so the first kernel compile never lands on an interview.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/health || exit 1; [ -f /tmp/warm ] || { curl -fs -o /dev/null http://127.0.0.1:8080/completion -H 'Content-Type: application/json' -d \"{\\\"prompt\\\": \\\"$$(yes '면접 질문과 답변을 검토합니다.' | head -n 40 | tr -d '\\n')\\\", \\\"n_predict\\\": 4}\" && touch /tmp/warm; } || exit 1"]
      timeout: 240s
    restart: unless-stopped

  llm-eval:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_CPU_TAG:-server}
    command: ["-m", "/models/llm/qwen3.5-4b.gguf", "--host", "0.0.0.0", "--port", "8080", "--jinja",
              "-c", "8192", "--parallel", "1", "-t", "${LLM_EVAL_THREADS:-6}", "--alias", "${LLM_MODEL:-qwen3.5:4b}"]
    volumes: [ "../models:/models:ro" ]
    networks: [internal]
    healthcheck: *llama-health
    restart: unless-stopped

  stt:
    <<: *gpu
    build: { <<: *backend-build, target: ai }
    image: aihire-ai:dev
    command: ["python", "-m", "app.aisvc.speech_server", "stt"]
    environment:
      AIHIRE_AI_TOKEN: ${AI_TOKEN:-dev-ai-token-change-me}
      AIHIRE_STT_URL: http://0.0.0.0:8201
      AIHIRE_STT_DEVICE: ${STT_DEVICE:-cuda}
      AIHIRE_MODEL_AUTO_DOWNLOAD: "false"
    volumes: [ "../models:/models:ro" ]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8201/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 5m
      retries: 6
    restart: unless-stopped

  tts:
    image: aihire-ai:dev  # built by `stt`
    command: ["python", "-m", "app.aisvc.speech_server", "tts"]
    environment:
      AIHIRE_AI_TOKEN: ${AI_TOKEN:-dev-ai-token-change-me}
      AIHIRE_TTS_URL: http://0.0.0.0:8202
      AIHIRE_MODEL_AUTO_DOWNLOAD: "false"
    volumes: [ "../models:/models:ro" ]
    networks: [internal]
    depends_on:
      stt: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8202/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 5m
      retries: 6
    restart: unless-stopped

  embed:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_CPU_TAG:-server}
    command: ["-m", "/models/embed/bge-m3.gguf", "--host", "0.0.0.0", "--port", "8080", "--embeddings",
              "--pooling", "cls", "-c", "8192", "-t", "2", "--alias", "bge-m3"]
    volumes: [ "../models:/models:ro" ]
    networks: [internal]
    healthcheck: *llama-health
    restart: unless-stopped

  # ── data ──────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 + pgvector (migration 0004)
    environment:
      POSTGRES_DB: aihire
      POSTGRES_USER: aihire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihire_dev_only}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihire -d aihire"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Celery broker and state. PostgreSQL keeps the durable job record; AOF keeps queued messages across restarts
    # so nothing has to wait for the 30 s re-send (ADR-0013/0014).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [ "redisdata:/data" ]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    # Encrypted file store: SSE-S3 with the built-in KMS key below (the app makes it the bucket default).
    # MinIO no longer publishes images on Docker Hub: MINIO_IMAGE in .env picks the image (deploy/README.md).
    # COMPOSE_PROFILES=minio in .env starts it (default in .env.example); leave it out with STORAGE_BACKEND=local.
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: ["minio"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aihire}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-secret-change-me}
      # Development key ("name:base64 of 32 bytes"); generate your own for anything beyond a local demo.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-aihire-dev:aKULpVexvUWG9PIUC2xQIAltKIx3rQSGlR+6YThYXsU=}
      MINIO_BROWSER: "off"
    volumes: [ "miniodata:/data" ]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

networks:
  internal:
    internal: true
  front: {}
  egress: {}

secrets:
  build_ca:  # extra CA for image builds behind a TLS-inspecting proxy; the default file is empty
    file: ${BUILD_CA_FILE:-./empty-ca.pem}

volumes:
  pgdata:
  redisdata:
  miniodata:
  appdata:  # local-storage fallback only (STORAGE_BACKEND=local)
  cudacache:  # llm-rt's compiled CUDA kernels
