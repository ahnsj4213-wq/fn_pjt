<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>모의면접 플랫폼 첫 화면</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar, category chips, horizontal snap slider of posting posters; detail and stub pages swap into the same shell */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --ink: #17201d;
  --muted: #5d6a65;
  --line: #dde2df;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --accent-soft: #e2f0ea;
  --warn-soft: #fff3dc;
  --warn-ink: #7a4b00;
  --proto: #23302c;
  --proto-ink: #e9efec;
  --font-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #1a2220; --ink: #e6ece9; --muted: #9aa8a2; --line: #2c3633;
    --accent: #4fb896; --accent-ink: #0d1412; --accent-soft: #1d3029; --warn-soft: #3a2f1a; --warn-ink: #f2cc85;
    --proto: #e3ebe7; --proto-ink: #18201d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #1a2220; --ink: #e6ece9; --muted: #9aa8a2; --line: #2c3633;
  --accent: #4fb896; --accent-ink: #0d1412; --accent-soft: #1d3029; --warn-soft: #3a2f1a; --warn-ink: #f2cc85;
  --proto: #e3ebe7; --proto-ink: #18201d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; padding-bottom: 96px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; background: none; border: 0; color: var(--ink); padding: 0; display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
.spacer { flex: 1; }
.btn { border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
.user-chip { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; }

/* main */
.hero { padding-block: 32px 8px; display: grid; gap: 6px; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 4vw, 34px); letter-spacing: -0.03em; line-height: 1.25; margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 20px 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; }
.chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.slider-head { display: flex; align-items: baseline; gap: 12px; padding-block: 20px 12px; }
.slider-head h2 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0; }
.slider-head .count { color: var(--muted); font-size: 14px; }
.arrows { margin-left: auto; display: flex; gap: 6px; }
.arrow { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; font-size: 16px; }
.arrow:disabled { opacity: .35; cursor: default; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, calc((100% - 3 * 16px) / 4)); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding-bottom: 12px; scrollbar-width: thin; }
@media (max-width: 860px) { .track { grid-auto-columns: minmax(200px, calc((100% - 16px) / 2)); } }
@media (max-width: 480px) { .track { grid-auto-columns: 78%; } }
@media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }
.poster { scroll-snap-align: start; border: 0; padding: 0; text-align: left; background: none; color: inherit; display: grid; gap: 10px; }
.poster-img { position: relative; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 12px; overflow: hidden; color: #fff; padding: 18px; display: flex; flex-direction: column; transition: transform .18s ease; }
.poster:hover .poster-img { transform: translateY(-3px); }
@media (prefers-reduced-motion: reduce) { .poster-img { transition: none; } .poster:hover .poster-img { transform: none; } }
.poster-img::after { content: ""; position: absolute; right: -30%; bottom: -18%; width: 90%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.12); }
.p-logo { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.95); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.p-company { margin-top: 12px; font-size: 13px; opacity: .85; font-weight: 500; }
.p-title { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; margin-top: 4px; text-wrap: balance; position: relative; z-index: 1; }
.p-foot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; position: relative; z-index: 1; }
.p-tag { font-size: 12px; background: rgba(0,0,0,.22); border-radius: 6px; padding: 2px 8px; }
.dday { position: absolute; top: 18px; right: 18px; background: #fff; color: #17201d; font-weight: 700; font-size: 12px; border-radius: 6px; padding: 3px 8px; font-variant-numeric: tabular-nums; z-index: 1; }
.poster-meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; }
.dots { display: flex; gap: 6px; justify-content: center; padding-block: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); border: 0; padding: 0; }
.dot.on { background: var(--ink); width: 20px; border-radius: 4px; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-block: 32px 16px; }
@media (max-width: 720px) { .how { grid-template-columns: 1fr; } }
.how div { border-top: 2px solid var(--ink); padding-top: 12px; }
.how b { font-family: var(--font-display); display: block; font-size: 15px; }
.how span { color: var(--muted); font-size: 14px; }
.sample-note { font-size: 12px; color: var(--muted); padding-block: 8px 24px; }

/* detail */
.back { background: none; border: 0; color: var(--muted); padding: 0; font-weight: 500; margin-block: 20px 12px; }
.back:hover { color: var(--ink); }
.detail { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 800px) { .detail { grid-template-columns: 1fr; } .detail .poster-img { max-width: 260px; } }
.detail h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 3.4vw, 30px); letter-spacing: -0.03em; line-height: 1.3; margin: 4px 0 12px; text-wrap: balance; }
.d-company { color: var(--muted); font-weight: 500; }
.facts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 24px; }
@media (max-width: 560px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .facts div { border-bottom: 1px solid var(--line); } }
.facts div { padding: 12px 14px; border-right: 1px solid var(--line); }
.facts div:last-child { border-right: 0; }
.facts dt { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.section { padding-block: 18px; border-top: 1px solid var(--line); max-width: 68ch; }
.section h2 { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0 0 8px; }
.section ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.qtypes { display: flex; flex-wrap: wrap; gap: 6px; }
.qtypes span { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
.start-bar { margin-top: 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.start-bar p { margin: 0; flex: 1 1 260px; min-width: 0; font-size: 14px; color: var(--muted); }
.start-bar p b { color: var(--ink); display: block; font-size: 15px; }
.btn-lg { padding: 13px 26px; font-size: 16px; border-radius: 10px; }
.checks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-top: 6px; }
.ok { color: var(--accent); font-weight: 600; }
.no { color: var(--warn-ink); font-weight: 600; }

/* stub pages */
.stub { max-width: 440px; margin: 40px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
.stub.wide { max-width: 640px; }
.stub h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin: 0 0 4px; }
.stub .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.notice { background: var(--warn-soft); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 18px; }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select, .field textarea { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); color: var(--ink); width: 100%; }
.field textarea { min-height: 110px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
.form .btn-primary { padding: 12px; font-size: 15px; }
.alt { text-align: center; font-size: 14px; color: var(--muted); margin-top: 16px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.stub-tag { display: inline-block; font-size: 11px; letter-spacing: .06em; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 1px 6px; margin-bottom: 10px; }
.ready { display: grid; gap: 10px; margin: 18px 0; }
.ready div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; font-size: 14px; }
.ready span:first-child { color: var(--muted); }

/* prototype control panel */
.proto { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--proto); color: var(--proto-ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.proto .wrap { display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; padding-block: 10px; font-size: 13px; }
.proto strong { font-size: 11px; letter-spacing: .08em; opacity: .7; }
.tog { display: flex; align-items: center; gap: 6px; background: none; border: 0; color: inherit; padding: 0; font-size: 13px; }
.tog i { width: 30px; height: 17px; border-radius: 9px; background: currentColor; opacity: .3; position: relative; font-style: normal; }
.tog i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--proto); transition: left .15s; }
.tog[aria-pressed="true"] i { opacity: 1; }
.tog[aria-pressed="true"] i::after { left: 15px; }
.proto .reset { background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 3px 10px; font-size: 12px; opacity: .8; }
.proto .crumb { margin-left: auto; opacity: .7; }
@media (max-width: 600px) { .proto .crumb { display: none; } }
.gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; }
.gbtn:hover { border-color: var(--muted); }
.gmark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 12px; }
.fine { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
@media (max-width: 520px) { .roles { grid-template-columns: 1fr; } }
.role-card { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 18px; display: grid; gap: 6px; }
.role-card:hover { border-color: var(--accent); }
.role-card b { font-family: var(--font-display); font-size: 17px; }
.role-card span { font-size: 13px; color: var(--muted); }
.role-card em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--warn-ink); }
.badge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; background: var(--accent-soft); color: var(--accent); }
.badge.wait { background: var(--warn-soft); color: var(--warn-ink); }
.banner { margin-top: 20px; background: var(--warn-soft); color: var(--warn-ink); border-radius: 10px; padding: 12px 16px; font-size: 14px; }
.proto select { font: inherit; font-size: 12px; border-radius: 6px; padding: 3px 6px; background: var(--proto); color: var(--proto-ink); border: 1px solid currentColor; }
@media (max-width: 520px) { .user-chip .uname { display: none; } }
/* interview run screen */
:root { --s1: #2a78d6; --s2: #eb6834; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #3987e5; --s2: #d95926; } }
:root[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; }
:root { --stage: #e4ebe7; --danger: #c0352b; --danger-ink: #ffffff; --veil: rgba(245, 246, 244, .78); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #18211e; --danger: #ff7b6e; --danger-ink: #1a0d0b; --veil: rgba(17, 23, 21, .78); } }
:root[data-theme="dark"] { --stage: #18211e; --danger: #ff7b6e; --danger-ink: #1a0d0b; --veil: rgba(17, 23, 21, .78); }
[hidden] { display: none !important; }
@media (max-width: 600px) { body { padding-bottom: 160px; } }
body.in-run .topbar { display: none; }
.run { padding-block: 16px 24px; display: grid; gap: 14px; }
.run-head { display: flex; align-items: center; gap: 12px; }
.run-head .co { font-weight: 600; min-width: 0; flex: 1; }
.run-head .co small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.progress { display: grid; gap: 6px; }
.prog-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog-label b { color: var(--ink); }
.segs { display: grid; gap: 4px; }
.seg { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.seg i { display: block; height: 100%; width: 0; background: var(--accent); }
.stage { position: relative; background: var(--stage); border-radius: 16px; min-height: 540px; display: grid; justify-items: center; align-content: start; gap: 14px; padding: 28px 16px 80px; overflow: hidden; }
.cam { position: absolute; top: 16px; right: 16px; width: clamp(150px, 24%, 240px); aspect-ratio: 4 / 3; border-radius: 12px; background: #1c2522; overflow: hidden; border: 3px solid transparent; z-index: 2; transition: border-color .2s; }
.cam.left { right: auto; left: 16px; }
.cam.away { border-color: var(--danger); }
.cam svg { width: 100%; height: 100%; display: block; }
.cam .rec { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; color: #fff; background: rgba(0,0,0,.45); border-radius: 4px; padding: 1px 6px; display: flex; align-items: center; gap: 4px; }
.cam .rec::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #ff4d4d; }
.cam .gaze { position: absolute; bottom: 8px; left: 8px; font-size: 11px; font-weight: 600; color: #fff; background: rgba(0,0,0,.45); border-radius: 4px; padding: 1px 6px; }
.cam.away .gaze { background: var(--danger); color: var(--danger-ink); }
.cam .me { position: absolute; bottom: 8px; right: 8px; font-size: 11px; color: rgba(255,255,255,.8); }
@media (max-width: 640px) {
  .stage { padding-top: 16px; min-height: 0; }
  .cam, .cam.left { position: relative; top: auto; right: auto; left: auto; width: 150px; justify-self: end; }
  .cam.left { justify-self: start; }
}
.interviewer { width: clamp(170px, 30vw, 250px); max-width: 100%; }
.interviewer .mouth { transform-box: fill-box; transform-origin: center; }
.interviewer.speaking .mouth { animation: talk .28s ease-in-out infinite alternate; }
.interviewer .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
@keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(3.2); } }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .interviewer .mouth, .interviewer .eyes { animation: none !important; } }
.bubble { position: relative; max-width: 60ch; background: var(--surface); border-radius: 14px; padding: 14px 20px; text-align: center; display: grid; gap: 4px; }
.bubble::before { content: ""; position: absolute; top: -8px; left: 50%; width: 16px; height: 16px; background: var(--surface); transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
.bubble small { color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: .04em; position: relative; }
.bubble p { margin: 0; font-size: 17px; font-weight: 500; text-wrap: balance; position: relative; }
.timer { display: flex; align-items: center; gap: 16px; }
.ring { width: 92px; height: 92px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; }
.ring.low .fg { stroke: var(--danger); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.ring.low span { color: var(--danger); }
.phase b { display: block; font-size: 16px; }
.phase span { color: var(--muted); font-size: 13px; }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; background: var(--veil); font-family: var(--font-display); font-weight: 800; font-size: 150px; z-index: 4; pointer-events: none; }
.countdown em { font-style: normal; font-size: 16px; font-family: var(--font-body); display: block; text-align: center; color: var(--muted); }
.warn { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: var(--danger); color: var(--danger-ink); border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 14px; z-index: 3; }
.run-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.run-body { display: grid; gap: 14px; }
.run-body.has-tool { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
.run-body.has-tool .interviewer { width: clamp(150px, 20vw, 210px); }
@media (max-width: 980px) { .run-body.has-tool { grid-template-columns: 1fr; } }
.bubble.fu { box-shadow: 0 0 0 2px var(--accent); } .bubble.fu::before { box-shadow: -2px -2px 0 0 var(--accent); }
.bubble.cut { background: var(--warn-soft); } .bubble.cut::before { background: var(--warn-soft); } .bubble.cut small { color: var(--warn-ink); }
.bubble.think p { color: var(--muted); }
.tts { justify-self: center; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); position: relative; }
.wave { display: inline-flex; align-items: center; gap: 2px; height: 12px; }
.wave i, .cam .mic i { width: 3px; border-radius: 2px; background: var(--accent); height: 40%; animation: wv .5s ease-in-out infinite alternate; }

function setupSlider() {
  const track = $("#track"), dots = $("#dots"), prev = $("#prev"), next = $("#next");
  const pages = () => Math.max(1, Math.ceil((track.scrollWidth - 4) / track.clientWidth));
  const cur = () => Math.round(track.scrollLeft / track.clientWidth);
  function paint() {
    const n = pages(), c = Math.min(cur(), n - 1);
    dots.innerHTML = n > 1 ? Array.from({ length: n }, (_, i) => `<button class="dot${i === c ? " on" : ""}" type="button" aria-label="${i + 1}번째 묶음" data-i="${i}"></button>`).join("") : "";
    dots.querySelectorAll(".dot").forEach(d => d.addEventListener("click", () => track.scrollTo({ left: d.dataset.i * track.clientWidth })));
    prev.disabled = track.scrollLeft <= 2;
    next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
  }
  prev.addEventListener("click", () => track.scrollBy({ left: -track.clientWidth }));
  next.addEventListener("click", () => track.scrollBy({ left: track.clientWidth }));
  let raf; track.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); });
  window.onresize = paint;
  paint();
}

function openModal(html, mount, wide) {

const RX = {
  email: /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i,
  pw: /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d!@#$%^&*._-]{8,20}$/,
  phone: /^01[016789]-\d{3,4}-\d{4}$/
};
const MSG = { email: "이메일 형식으로 입력해 주십시오 (예: name@example.com)", pw: "영문과 숫자를 섞어 8~20자로 입력해 주십시오", phone: "010-0000-0000 형식으로 입력해 주십시오" };
// rules: [[input id, 검사 함수 → 오류 문장 또는 ""]]
function check(root, rules) {
  let ok = true, first = null;
  rules.forEach(([id, fn]) => {
    const el = root.querySelector("#" + id), msg = fn(el);
    let err = root.querySelector(`[data-err="${id}"]`);
    if (!err) { err = document.createElement("small"); err.className = "err"; err.dataset.err = id; (el.closest(".field") || el.parentElement.parentElement).appendChild(err); }
    err.textContent = msg; el.setAttribute("aria-invalid", !!msg);
    if (msg) { ok = false; first ||= el; }
  });
  first?.focus();
  return ok;
}
const need = (label, rx) => el => !el.value.trim() ? `${label}${josa(label)} 입력해 주십시오` : rx && !RX[rx].test(el.value.trim()) ? MSG[rx] : "";
const fmtPhone = el => el.addEventListener("input", () => {

});

  const goTo = i => track.scrollTo({ left: i * track.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  const paint = () => {
    const i = cur();

    $("#g-prev").disabled = i === 0;

  let raf; track.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); });
  m.querySelectorAll(".gdots .dot").forEach(d => d.addEventListener("click", () => goTo(+d.dataset.i)));
  $("#g-prev").addEventListener("click", () => goTo(cur() - 1));

      <div class="segs" style="grid-template-columns:repeat(${iv.qs.length},1fr)">${iv.qs.map(() => `<div class="seg"><i></i></div>`).join("")}</div>
    </div>
    <div class="run-body" id="rbody">
      <section class="stage">
        <div class="cam${iv.camLeft ? " left" : ""}" id="cam">${CAM_SVG}<span class="rec" id="rec" hidden>REC</span><span class="mic" id="mic" title="음성 감지" hidden><i></i><i></i><i></i><i></i></span><span class="gaze" id="gaze">시선 정상</span><span class="me">${esc(state.user)}</span></div>
        ${INTERVIEWER_SVG}
        <div class="bubble" id="bubble"><small id="qtype"></small><p id="qtext"></p><span class="tts" id="tts" hidden><span class="wave"><i></i><i></i><i></i><i></i></span>음성으로 읽는 중</span></div>
        <div class="timer">
          <div class="ring" id="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="ring-fg" cx="50" cy="50" r="42" stroke-dasharray="263.9"/></svg><span id="ring-num"></span></div>
          <div class="phase" id="phase"></div>
        </div>
        <div class="sttlive" id="sttlive" hidden><span class="hint">실시간 자막 · 말한 내용이 글자로 바뀝니다</span><p id="stt-text"></p></div>
        <div class="countdown" id="count" hidden></div>
        <div class="warn" id="warn" role="alert" hidden></div>
      </section>
      <section class="tool" id="tool" hidden></section>
    </div>
    <div class="run-actions" id="acts"></div>
  </div>`;
  $("#quit").addEventListener("click", () => { stopRun(); go("detail"); toast("면접을 중단했습니다"); });
  $("#proto-extra").innerHTML = `<button class="tog" id="tog-gaze" type="button" aria-pressed="${iv.gazeAway}"><i></i>시선 이탈 재현</button><button class="reset" id="cut" type="button" title="답변 중에 누르면 면접관이 끼어듭니다">답변 길게 끌기 재현</button><button class="reset" id="cam-side" type="button">영상 위치: ${iv.camLeft ? "왼쪽" : "오른쪽"}</button>`;
  $("#tog-gaze").addEventListener("click", e => { iv.gazeAway = !iv.gazeAway; e.currentTarget.setAttribute("aria-pressed", iv.gazeAway); paintGaze(); });
  $("#cut").addEventListener("click", () => {
    if (iv.phase !== "answer") return toast("답변 중일 때 눌러 주십시오");
    iv.saveT = iv.t; iv.cuts++; setPhase("cut");
  });
  $("#cam-side").addEventListener("click", e => { iv.camLeft = !iv.camLeft; $("#cam").classList.toggle("left", iv.camLeft); e.currentTarget.textContent = "영상 위치: " + (iv.camLeft ? "왼쪽" : "오른쪽"); });
  paintQuestion(); paintPhase(); paintTick(); paintGaze();
}

function paintQuestion() {
  const iv = state.iv, q = curQ();
  $("#bubble").classList.toggle("fu", iv.fu);
  $("#qtype").textContent = iv.fu ? `꼬리질문 · 질문 ${q.fuOf} 답변에 이어서` : `질문 ${iv.i + 1} · ${q.t}`;
  $("#qtext").textContent = q.q;
  $("#prog-q").innerHTML = `<b>질문 ${iv.i + 1}${iv.fu ? " · 꼬리질문" : ""}</b> / ${iv.qs.length}${iv.fuCount ? ` · 꼬리질문 ${iv.fuCount}개` : ""}`;
  paintTool();
}

function paintTool() {
  const iv = state.iv, kind = toolOf(), el = $("#tool");
  $("#rbody").classList.toggle("has-tool", !!kind);
  el.hidden = !kind;
  if (el.dataset.kind === kind + iv.i) return;
  el.dataset.kind = kind + iv.i;
  if (kind === "code") {
    const key = iv.i + iv.lang;
    el.className = "tool code";
    el.innerHTML = `<div class="tool-h"><b>코드 에디터</b>
        <select id="lang" aria-label="언어">${[["python", "Python"], ["java", "Java"], ["javascript", "JavaScript"]].map(([v, l]) => `<option value="${v}"${v === iv.lang ? " selected" : ""}>${l}</option>`).join("")}</select>
        <button class="btn btn-primary" id="run-code" type="button">${iv.sub?.[iv.i] ? "다시 제출" : "코드 제출"}</button></div>
      <div class="editor"><pre class="ln" id="ln" aria-hidden="true"></pre><textarea id="code" spellcheck="false" aria-label="코드 입력">${esc(iv.code[key] ?? CODE_START[iv.lang])}</textarea></div>
      <div class="out" id="out">${iv.sub?.[iv.i] ? submitNote("코드") : "코드는 실행하지 않습니다. 제출하면 AI가 코드를 읽고 논리, 예외 처리, 가독성을 평가합니다. 제출하지 않으면 답변이 끝날 때 자동으로 제출됩니다."}</div>
      <p class="fine" style="margin:0">코드뿐 아니라 쓰면서 말로 설명한 내용도 평가됩니다. 생각할 시간부터 코드를 쓸 수 있습니다.</p>`;
    const ta = $("#code"), ln = $("#ln");
    const lines = () => { ln.textContent = ta.value.split("\n").map((_, k) => k + 1).join("\n"); };
    ta.addEventListener("input", () => { iv.code[iv.i + iv.lang] = ta.value; lines(); });
    ta.addEventListener("scroll", () => { ln.scrollTop = ta.scrollTop; });
    ta.addEventListener("keydown", e => {
      if (e.key !== "Tab") return; e.preventDefault();
      const s = ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input"));
    });
    $("#lang").addEventListener("change", e => { iv.lang = e.target.value; el.dataset.kind = ""; paintTool(); });
    $("#run-code").addEventListener("click", e => {
      const again = !!(iv.sub ||= {})[iv.i]; iv.sub[iv.i] = true;
      $("#out").innerHTML = submitNote("코드", again); e.currentTarget.textContent = "다시 제출";
    });
    lines();
  } else if (kind === "board") {
    el.className = "tool board";
    el.innerHTML = `<div class="tool-h"><b>화이트보드</b>
        <span class="pens">${[["ink", "검정 펜"], ["accent", "초록 펜"], ["danger", "빨강 펜"], ["erase", "지우개"]].map(([k, l]) => `<button type="button" class="pen p-${k}" data-pen="${k}" aria-pressed="${iv.pen === k}" title="${l}" aria-label="${l}">${k === "erase" ? "지우개" : ""}</button>`).join("")}</span>
        <button class="btn" id="b-undo" type="button">되돌리기</button><button class="btn" id="b-clear" type="button">모두 지우기</button><button class="btn btn-primary" id="b-sub" type="button">${iv.sub?.[iv.i] ? "다시 제출" : "그림 제출"}</button></div>
      <div class="bwrap"><canvas id="board" aria-label="화이트보드. 마우스나 터치로 그립니다"></canvas></div>
      <p class="fine" style="margin:0" id="b-note">${iv.sub?.[iv.i] ? submitNote("그림") : "제출한 그림은 이미지로 저장되고, AI가 말로 한 설명과 함께 평가합니다. 제출하지 않으면 답변이 끝날 때 자동으로 제출됩니다."}</p>`;
    const cv = $("#board"), strokes = iv.strokes[iv.i] ||= [];
    const color = k => getComputedStyle(document.documentElement).getPropertyValue({ ink: "--ink", accent: "--accent", danger: "--danger" }[k] || "--ink").trim();
    const draw = () => {
      const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
      const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height);
      g.lineCap = g.lineJoin = "round";
      strokes.forEach(s => {
        g.globalCompositeOperation = s.pen === "erase" ? "destination-out" : "source-over";
        g.strokeStyle = color(s.pen); g.lineWidth = s.pen === "erase" ? 18 : 2.5;
        g.beginPath(); s.pts.forEach(([x, y], k) => k ? g.lineTo(x * r.width, y * r.height) : g.moveTo(x * r.width, y * r.height)); g.stroke();
      });
      g.globalCompositeOperation = "source-over";
    };
    let cur = null;
    const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
    cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); cur = { pen: iv.pen, pts: [pt(e)] }; strokes.push(cur); });
    cv.addEventListener("pointermove", e => { if (cur) { cur.pts.push(pt(e)); draw(); } });
    const end = () => { cur = null; };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    el.querySelectorAll("[data-pen]").forEach(b => b.addEventListener("click", () => { iv.pen = b.dataset.pen; el.querySelectorAll("[data-pen]").forEach(x => x.setAttribute("aria-pressed", x === b)); }));
    $("#b-undo").addEventListener("click", () => { strokes.pop(); draw(); });
    $("#b-clear").addEventListener("click", () => { strokes.length = 0; draw(); });
    $("#b-sub").addEventListener("click", e => { const again = !!(iv.sub ||= {})[iv.i]; iv.sub[iv.i] = true; $("#b-note").innerHTML = submitNote("그림", again); e.currentTarget.textContent = "다시 제출"; });
    requestAnimationFrame(draw);
    const onResize = () => $("#board") === cv ? draw() : removeEventListener("resize", onResize);
    addEventListener("resize", onResize);
  } else el.innerHTML = "";
}

function paintPhase() {
  const iv = state.iv, q = curQ(), ph = iv.phase;
  $("#char").classList.toggle("speaking", ph === "ask" || ph === "cut");
  $("#rec").hidden = ph !== "answer";
  $("#mic").hidden = ph !== "answer";
  $("#sttlive").hidden = ph !== "answer";
  $("#mic").classList.toggle("on", ph === "answer");
  $("#tts").hidden = !(ph === "ask" || ph === "cut");
  $("#bubble").classList.toggle("cut", ph === "cut");
  $("#bubble").classList.toggle("think", ph === "think");
  if (ph === "cut") { $("#qtype").textContent = "면접관이 끼어들었습니다"; $("#qtext").textContent = CUT_LINE; }
  else if (ph === "think") { $("#qtype").textContent = "답변 분석 중"; $("#qtext").textContent = "답변 잘 들었습니다."; }
  else paintQuestion();
  const ans = phaseDur("answer");
  const txt = {
    ask: [iv.fu ? "면접관이 꼬리질문을 하고 있습니다" : "면접관이 질문하고 있습니다", "질문을 끝까지 들어 주십시오"],
    prep: ["생각할 시간", `${phaseDur("prep")}초가 지나면 답변 녹화가 시작됩니다`],
    answer: ["답변 중", `제한시간 ${ans >= 120 ? ans / 60 + "분" : ans + "초"} · 말이 3초 넘게 멈추면 답변이 끝난 것으로 봅니다`],
    think: ["답변을 분석하고 있습니다", "AI가 답변 내용을 보고 꼬리질문이 필요한지 판단합니다"],
    cut: ["면접관이 말하는 중", "말씀이 끝나면 남은 시간 동안 이어서 답변합니다"]
  }[ph];
  $("#phase").innerHTML = `<b>${txt[0]}</b><span>${txt[1]}</span>`;
  const last = iv.i === iv.qs.length - 1 && (iv.fu || !q.fu);
  const boardBtn = !iv.fu && iv.qs[iv.i].tool === "board-opt" && (ph === "prep" || ph === "answer") ? `<button class="btn btn-lg" id="board-tog" type="button">${iv.boardOpen ? "화이트보드 닫기" : "화이트보드 열기"}</button>` : "";
  $("#acts").innerHTML = ph === "prep" ? `${iv.replayed ? "" : `<button class="btn btn-lg" id="replay" type="button">질문 다시 듣기</button>`}<button class="btn btn-lg" id="skip" type="button">바로 답변 시작</button>${boardBtn}`
    : ph === "answer" ? `${boardBtn}<button class="btn btn-primary btn-lg" id="done" type="button">${last ? "답변 완료하고 면접 끝내기" : "답변 완료"}</button>` : "";
  $("#skip")?.addEventListener("click", () => setPhase("answer"));
  $("#replay")?.addEventListener("click", () => { iv.replayed = true; setPhase("ask"); });
  $("#done")?.addEventListener("click", () => setPhase("think"));
  $("#board-tog")?.addEventListener("click", () => { iv.boardOpen = !iv.boardOpen; paintTool(); paintPhase(); });
}

function setPhase(ph, t) {
  const iv = state.iv;
  if (ph === "think" && !iv.fu) iv.answered++;
  if (ph === "answer" && t == null) iv.ansEl = 0;
  iv.phase = ph; iv.t = t ?? phaseDur(ph); paintPhase(); paintTick();
}

// 분석이 끝나면: 꼬리질문이 필요하면 같은 질문에 이어서 묻고, 아니면 다음 본질문으로
function afterThink() {
  const iv = state.iv, m = iv.qs[iv.i], allow = iv.fuCount < (getS(state.postId).follow ?? 2);
  if (!iv.fu && m.fu && allow) { iv.fu = true; iv.fuCount++; iv.replayed = false; return setPhase("ask"); }
  if (iv.i >= iv.qs.length - 1) {
    stopRun();
    state.myApps = [{ postId: state.postId, date: "10.22", done: true, status: state.share ? "기업 검토 중" : "연습 모드" }, ...state.myApps.filter(a => a.postId !== state.postId)];
    const bp = postById(state.postId);
    if (state.share && bp?.company === COMPANY) { // 결과 공유에 동의하면 기업 응시자 목록과 알림에 들어감
      const nm = state.profile?.name || state.user, id = 100 + BIZ.applicants.length;
      BIZ.applicants.unshift({ id, name: nm, email: state.profile?.email, postId: bp.id, date: md(ymd(TODAY)), done: 5, warn: iv.warnings || 0, status: "검토 전", cs: QCATS.map((c, k) => 60 + ((id * 37 + k * 23) % 35)), memo: "", fresh: true });
      pushNote({ kind: "apply", appId: id, text: `${nm}님이 「${bp.title}」 AI 면접을 마쳤습니다` });
    }
    return go("done");
  }
  iv.i++; iv.fu = false; iv.replayed = false; iv.boardOpen = false; setPhase("ask");
}

function paintTick() {
  const iv = state.iv, ph = iv.phase, dur = phaseDur(ph);
  const frac = Math.max(0, iv.t / dur);
  const ring = $("#ring"), idle = ph === "ask" || ph === "think" || ph === "cut";
  $("#ring-fg").style.strokeDashoffset = idle ? 0 : (263.9 * (1 - frac)).toFixed(1);
  $("#ring-num").textContent = idle ? "···" : Math.ceil(iv.t);
  ring.classList.toggle("low", ph === "answer" && iv.t <= 10);
  const cnt = $("#count");
  if (ph === "prep" && iv.t <= 3) { cnt.hidden = false; cnt.innerHTML = `<div>${Math.ceil(iv.t)}<em>곧 답변이 시작됩니다</em></div>`; } else cnt.hidden = true;
  // 본질문 안에서의 진행: 질문 10% · 준비 15% · 답변 55% · 분석 5%, 꼬리질문이 붙으면 남은 15%
  const step = { ask: [0, .1], prep: [.1, .25], answer: [.25, .8], cut: [.25, .8], think: [.8, .85] }[ph];
  let inQ = step[0] + (step[1] - step[0]) * (ph === "cut" ? 1 - iv.saveT / phaseDur("answer") : 1 - frac);
  if (iv.fu) inQ = .85 + .15 * (inQ / .85);
  view.querySelectorAll(".seg i").forEach((el, k) => (el.style.width = (k < iv.i ? 100 : k === iv.i ? inQ * 100 : 0) + "%"));
  $("#prog-pct").textContent = `전체 ${Math.round((iv.i + inQ) / iv.qs.length * 100)}%`;
  if (ph === "answer") {
    const src = (iv.fu ? REPORT_FU[iv.i + 1]?.stt : REPORT_QS[iv.i]?.stt) || "";
    const txt = src.replace("{company}", POSTS.find(x => x.id === state.postId).company), n = Math.min(txt.length, Math.floor(iv.ansEl * 9));
    $("#stt-text").textContent = n ? txt.slice(0, n) + (n < txt.length ? "…" : "") : "말씀을 기다리고 있습니다";
  }
}

function paintGaze() {
  const iv = state.iv;
  $("#cam").classList.toggle("away", iv.gazeAway);
  $("#gaze").textContent = iv.gazeAway ? "시선 이탈" : "시선 정상";
  const w = $("#warn");
  w.hidden = !iv.warned;
  if (iv.warned) w.textContent = iv.warnings >= 3 ? `시선 이탈이 반복되고 있습니다. 다른 화면을 보는 것으로 의심돼 기록됩니다. (경고 ${iv.warnings}회)` : `시선이 화면을 벗어났습니다. 화면을 봐 주십시오. (경고 ${iv.warnings}회)`;
}

function tick() {
  const iv = state.iv;
  if (state.view !== "run" || !iv) return;
  iv.t -= .1; iv.elapsed += .1;
  if (iv.phase === "answer") iv.ansEl += .1;
  if (iv.gazeAway) iv.awayTotal += .1;
  // 시선 이탈이 1.5초 이어지면 경고 1회
  if (iv.gazeAway) { iv.awayFor += .1; if (iv.awayFor >= 1.5 && !iv.warned) { iv.warned = true; iv.warnings++; paintGaze(); } }
  else if (iv.awayFor || iv.warned) { iv.awayFor = 0; iv.warned = false; paintGaze(); }
  if (iv.t <= 0) {
    if (iv.phase === "ask") return setPhase("prep");
    if (iv.phase === "prep") return setPhase("answer");
    if (iv.phase === "cut") return setPhase("answer", Math.min(iv.saveT, 30));
    if (iv.phase === "think") return afterThink();
    return setPhase("think");
  }
  paintTick();
}

// 리포트 생성 안내: 실제로는 3~5분, 화면 시연에서는 8초 뒤 리포트로 바뀝니다
const GEN_STEPS = ["답변 음성을 텍스트로 정리", "평가 항목별 채점", "표정·음성·시선 분석", "총평과 우선순위 피드백 작성"];
function renderDone() {
  const iv = state.iv, p = POSTS.find(x => x.id === state.postId);
  const sec = Math.round((Date.now() - iv.started) / 1000), focus = Math.max(0, Math.round(100 * (1 - iv.awayTotal / Math.max(iv.elapsed, 1))));
  iv.focus = focus;
  view.innerHTML = `<div class="wrap"><div class="stub wide">
    <span class="stub-tag">간단 화면 · 면접 완료</span>
    <h1>면접이 완료되었습니다</h1>
    <p class="sub">최종 리포트 작성까지 3~5분 정도 소요됩니다. 이 화면을 열어 두면 리포트가 완성되는 대로 바로 바뀝니다.</p>
    <div class="gen" aria-live="polite"><div class="genbar"><i id="genbar"></i></div>
      <ol class="gensteps">${GEN_STEPS.map((t, k) => `<li id="gs-${k}">${t}</li>`).join("")}</ol></div>
    <div class="ready">
      <div><span>공고</span><span>${esc(p.company)} · ${esc(p.title)}</span></div>
      <div><span>답변한 질문</span><span>${iv.answered} / ${iv.qs.length} · 꼬리질문 ${iv.fuCount}개</span></div>
      <div><span>면접관 끼어들기</span><span>${iv.cuts}회</span></div>
      <div><span>시선 집중도</span><span>${focus}% · 이탈 경고 ${iv.warnings}회${iv.warnings >= 3 ? " · 부정행위 의심 기록" : ""}</span></div>
      <div><span>결과 공유</span><span>${state.share ? esc(p.company) + "에 공유됨" : "연습 모드 (공유 안 함)"}</span></div>
      <div><span>소요 시간</span><span>${Math.floor(sec / 60)}분 ${sec % 60}초</span></div>
    </div>
    <p class="fine" style="margin-bottom:16px">시연용 화면이라 8초 뒤에 리포트로 넘어갑니다. 면접 영상과 음성 원본은 분석이 끝나고 30일 뒤 자동으로 영구 삭제됩니다.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary btn-lg" id="report" type="button">기다리지 않고 리포트 보기</button>
      <button class="btn btn-lg" id="home" type="button">공고 목록으로</button>
    </div>
  </div></div>`;
  const t0 = Date.now(), DUR_MS = 8000;
  const step = () => {
    if (state.view !== "done") return;
    const f = Math.min(1, (Date.now() - t0) / DUR_MS);
    $("#genbar").style.width = f * 100 + "%";
    GEN_STEPS.forEach((_, k) => { const li = $("#gs-" + k); li.className = f >= (k + 1) / GEN_STEPS.length ? "done" : f >= k / GEN_STEPS.length ? "on" : ""; });
    if (f >= 1) return go("report", { reportBack: null });
    state.doneT = setTimeout(step, 200);
  };
  step();
  $("#report").addEventListener("click", () => go("report", { reportBack: null }));
  $("#home").addEventListener("click", () => go("main"));
}

function barChart(data, unit) {
  const W = 480, H = 200, L = 34, R = 8, T = 18, B = 26, n = data.length, max = Math.max(...data.map(d => d[1]));
  const step = [1, 2, 5, 10, 20, 50, 100].find(s => s >= max / 4) || 100, top = Math.ceil(max / step) * step;
  const band = (W - L - R) / n, bw = Math.min(34, band * .56), y = v => H - B - v / top * (H - T - B);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  data.forEach(([lab, v], i) => {
    const x = L + band * i + (band - bw) / 2, yt = y(v), r = Math.min(4, H - B - yt);
    g += `<path class="bar" data-i="${i}" d="M${x},${H - B} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${H - B} Z"/>`;
    g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
    if (i === n - 1) g += `<text class="val" x="${x + bw / 2}" y="${yt - 6}" text-anchor="middle">${v}${unit}</text>`;
    g += `<rect class="hit" data-i="${i}" data-tip="${lab} · ${v}${unit}" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${data.map(d => d[0] + " " + d[1] + unit).join(", ")}">${g}</svg>`;
}
function bindTips(root) {
  let tip = $("#ctip");
  if (!tip) { tip = document.createElement("div"); tip.id = "ctip"; tip.className = "ctip"; tip.hidden = true; document.body.appendChild(tip); }
  root.querySelectorAll("[data-tip]").forEach(h => {
    const svg = h.closest("svg");
    h.addEventListener("mouseenter", () => { tip.textContent = h.dataset.tip; tip.hidden = false; svg.querySelectorAll(".bar").forEach(b => b.classList.toggle("dim", b.dataset.i !== h.dataset.i)); });
    h.addEventListener("mousemove", e => { tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY - 30 + "px"; });
    h.addEventListener("mouseleave", () => { tip.hidden = true; svg.querySelectorAll(".bar").forEach(b => b.classList.remove("dim")); });
  });
}

function closeNoti() { const p = $("#npop"); if (!p) return; p.remove(); document.removeEventListener("mousedown", closeNoti._doc); BIZ.notes.forEach(n => (n.unread = false)); renderAuth(); }
function openNoti(btn) {
  if ($("#npop")) return closeNoti();
  const pop = document.createElement("div");
  pop.className = "npop"; pop.id = "npop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "알림");
  const r = btn.getBoundingClientRect();
  pop.style.top = r.bottom + 8 + "px";
  const toAdmin = extra => { closeNoti(); go("admin", Object.assign({ appSel: null, pEdit: null, evEdit: null }, extra)); };
  const paint = () => {
    pop.innerHTML = `<div class="npop-h"><b>알림</b><span class="hint">지원·일정·마감 소식</span></div>
      <div class="nlist">${BIZ.notes.map(n => {
        const p = n.postId && postById(n.postId);
        const act = n.kind === "deadline" ? (n.done ? `<span class="hint ok">${n.done}</span>` : p && p.status === "게시 중"
            ? `<button class="btn" data-ext="${n.id}" type="button">7일 연장</button><button class="btn" data-end="${n.id}" type="button">지금 마감</button>` : `<span class="hint">이미 마감된 공고입니다</span>`)
          : n.kind === "apply" ? `<button class="link" data-app="${n.appId ?? ""}" type="button">응시자 보기</button>`
          : `<button class="link" data-sch type="button">일정 보기</button>`;
        return `<div class="nitem${n.unread ? " un" : ""}"><span class="ndot k-${n.kind}" aria-hidden="true"></span><div><p>${esc(n.text)}</p><small>${n.at}</small><div class="nact">${act}</div></div></div>`;
      }).join("") || `<p class="hint" style="padding:12px 14px">새 알림이 없습니다</p>`}</div>`;
    pop.querySelectorAll("[data-ext]").forEach(b => b.addEventListener("click", () => {
      const n = BIZ.notes.find(x => x.id === +b.dataset.ext), p = postById(n.postId);
      p.dday += 7; n.done = `마감일을 ${md(ymd(addDays(p.dday)))}로 늘렸습니다`; logHist("연장", p.title, `마감일 ${md(ymd(addDays(p.dday)))}로 연장`); toast(n.done); paint(); if (state.view === "admin") render();
    }));
    pop.querySelectorAll("[data-end]").forEach(b => b.addEventListener("click", () => {
      const n = BIZ.notes.find(x => x.id === +b.dataset.end), p = postById(n.postId);
      p.status = "마감"; n.done = "공고를 마감했습니다"; logHist("마감", p.title, "마감 알림에서 담당자가 마감"); toast("공고를 마감했습니다. 메인 화면에서 내려갑니다"); paint(); if (state.view === "admin") render();
    }));
    pop.querySelectorAll("[data-app]").forEach(b => b.addEventListener("click", () => toAdmin({ adminTab: "applicants", appSel: +b.dataset.app || null })));
    pop.querySelectorAll("[data-sch]").forEach(b => b.addEventListener("click", () => toAdmin({ adminTab: "schedule" })));
  };
  paint();
  document.body.appendChild(pop);
  const right = Math.max(12, innerWidth - r.right);
  pop.style.right = (innerWidth - right - pop.offsetWidth < 12 ? Math.max(12, innerWidth - pop.offsetWidth - 12) : right) + "px";
  closeNoti._doc = e => { if (!pop.contains(e.target) && !btn.contains(e.target) && document.body.contains(e.target)) closeNoti(); };
  setTimeout(() => document.addEventListener("mousedown", closeNoti._doc));
}

function openTpl(fill) {

  const body = () => tab === "prev" ? BIZ.posts.map((p, i) => row("prev", i, p.title, `${p.status} · ${p.cat} · ${p.career}`)).join("")
    : tab === "base" ? CATS.map((c, i) => row("base", i, `${c} 기본 템플릿`, BASE_TPL[c].duties.join(", "))).join("")

    : `<label class="drop" for="tp-file"><input id="tp-file" type="file" accept=".docx,.pdf,.hwp,.txt"><b>다른 곳에서 쓰던 공고 파일을 올려 주십시오</b><span class="hint">DOCX, PDF, HWP · 파일 내용을 읽어 칸에 나눠 넣습니다</span></label><div id="tp-st"></div>`;
  openModal(`${mhead("템플릿 불러오기")}<div class="tabs" role="tablist" style="margin:0">${TABS.map(([k, l]) => `<button type="button" role="tab" data-tt="${k}">${l}</button>`).join("")}</div><div class="tlist" id="tlist"></div>
    <p class="fine" style="margin:0">불러오면 지금 입력한 내용이 템플릿 내용으로 바뀝니다. 마감일은 그대로 둡니다.</p>`, root => {
    const paint = () => {
      root.querySelectorAll("[data-tt]").forEach(b => b.setAttribute("aria-selected", b.dataset.tt === tab));
      root.querySelector("#tlist").innerHTML = body();
      root.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
        const [k, i] = b.dataset.pick.split(":"), src = k === "prev" ? BIZ.posts[+i] : k === "base" ? { cat: CATS[+i], ...BASE_TPL[CATS[+i]] } : BIZ.tpls[+i];
        fill(src); closeModal(); toast(k === "prev" ? `「${src.title}」 공고 내용을 불러왔습니다` : "템플릿을 불러왔습니다");
      }));
      root.querySelector("#tp-file")?.addEventListener("change", e => {
        const f = e.target.files[0]; if (!f) return;
        root.querySelector("#tp-st").innerHTML = `<div class="ocr"><span class="spin" aria-hidden="true"></span><div><b>${esc(f.name)}</b><p class="hint">공고 내용을 읽고 있습니다</p></div></div>`;
        setTimeout(() => { if (!$("#modal")) return; fill({ title: "서버 개발자 (경력)", cat: "개발", career: "경력 3년 이상", type: "정규직", duties: ["대규모 트래픽 API 설계와 개발", "레거시 시스템 개선"], reqs: ["Java/Spring 실무 3년 이상"], prefs: ["MSA 전환 경험"] }); closeModal(); toast(`${f.name}에서 공고 내용을 읽어 왔습니다. 칸마다 확인해 주십시오`); }, 1400);
      });

    root.querySelectorAll("[data-tt]").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tt; paint(); }));

}

  const waiting = BIZ.applicants.filter(a => a.status === "검토 전" && a.done === 5).length;
  const kpi = (l, v, s, up) => `<div class="kpi"><span>${l}</span><b>${v}</b><small class="${up ? "up" : ""}">${s}</small></div>`;
  const stat = BIZ.posts.filter(p => p.applicants);
  const rows = BIZ.posts.filter(p => p.status !== "작성 중").map(p => `<tr><td>${esc(p.title)}</td><td>${pill(p.status)}</td><td class="num">${p.views.toLocaleString()}</td><td class="num">${p.applicants}</td><td class="num">${p.views ? (p.applicants / p.views * 100).toFixed(1) + "%" : "—"}</td><td class="num">${p.avg ?? "—"}</td></tr>`).join("");
  el.insertAdjacentHTML("beforeend", `
    <div class="ph"><div><h1>대시보드</h1><p>2026년 10월 기준 · 화면 설계용 예시 데이터</p></div></div>
    <div class="kpis">
      ${kpi("이번 달 응시자", "44명", "9월보다 15명 늘었습니다", true)}
      ${kpi("게시 중인 공고", live.length + "개", `조회수 합계 ${live.reduce((s, p) => s + p.views, 0).toLocaleString()}회`)}
      ${kpi("결과 검토 대기", waiting + "명", "면접을 마쳤고 아직 결정하지 않았습니다")}
      ${kpi("면접 완료율", "86%", "시작한 44명 중 38명 완료")}
    </div>
    <div class="grid2">
      <div class="card"><h2>공고별 합격률 <small>합격 ÷ 담당자가 결정한 응시자 · 가중치 조정 참고용</small></h2>
        <div class="scores hrows">${stat.map(p => { const s = passStats(p); return `<div class="srow"><span title="${esc(p.title)}">${esc(p.title)}</span><span class="bar"><i style="width:${s.rate ?? 0}%"></i></span><b>${s.rate == null ? "—" : s.rate + "%"}</b><small>합격 ${s.pass} / 결정 ${s.dec}</small></div>`; }).join("")}</div>
        <p class="fine" style="margin:12px 0 0">직무마다 기준이 달라서 공고를 섞은 전체 합격률은 보여 주지 않습니다.</p></div>
      <div class="card"><h2>직무별 평균 점수 <small>끝까지 답변한 응시자 · 100점 만점</small></h2>
        <div class="scores hrows">${stat.map(p => `<div class="srow"><span title="${esc(p.title)}">${esc(p.title)}</span><span class="bar"><i style="width:${p.avg}%"></i></span><b>${p.avg}</b><small>응시 ${p.applicants}명</small></div>`).join("")}</div>
        <p class="fine" style="margin:12px 0 0">항목별 세부 점수는 응시자 상세와 결과 리포트에서 볼 수 있습니다.</p></div>
    </div>
    <div class="layout2">
      <div class="card"><h2>공고별 성과 <small>응시 전환율 = 응시자 ÷ 조회수</small></h2><div class="tblw"><table class="t">
        <thead><tr><th>공고</th><th>상태</th><th class="num">조회수</th><th class="num">응시자</th><th class="num">응시 전환율</th><th class="num">평균 점수</th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div style="display:grid;gap:16px">
        <div class="card"><h2>다가오는 일정 <button class="link" id="to-sch" type="button">전체 보기</button></h2>
          <div class="evlist">${allEvents().filter(e => e.d >= ymd(TODAY)).slice(0, 4).map(evRow).join("")}</div>
          <div class="total" style="margin-top:14px"><span>결과를 검토하지 않은 응시자 <b>${waiting}명</b></span><button class="link" id="to-app" type="button">응시자 보기</button></div>
        </div>
        <div class="card chart small"><h2>월별 응시자 수 <small>최근 6개월</small></h2>${barChart([["5월", 9], ["6월", 12], ["7월", 15], ["8월", 22], ["9월", 29], ["10월", 44]], "명")}</div>
      </div>
    </div>`);
  bindTips(el);
  $("#to-sch").addEventListener("click", () => { state.adminTab = "schedule"; render(); });
  $("#to-app").addEventListener("click", () => { state.adminTab = "applicants"; state.af = { post: "all", status: "검토 전", q: "" }; render(); });
  el.querySelectorAll(".evlist [data-ev]").forEach(r => r.addEventListener("click", () => { state.adminTab = "schedule"; state.evEdit = +r.dataset.ev || null; render(); }));
}

function aApplicants(el) {
  if (state.appSel) return aApplicant(el);
  const f = state.af ||= { post: "all", status: "all", q: "" };
  const opts = (arr, cur) => arr.map(([v, l]) => `<option value="${v}"${String(cur) === String(v) ? " selected" : ""}>${l}</option>`).join("");
  el.insertAdjacentHTML("beforeend", `
    <div class="ph"><div><h1>응시자 목록</h1><p>결과 공유에 동의하고 우리 공고로 AI 면접을 본 응시자입니다 · 예시 ${BIZ.applicants.length}명</p></div></div>
    <div class="filters">
      <select id="af-post" aria-label="공고">${opts([["all", "모든 공고"], ...BIZ.posts.filter(p => p.applicants).map(p => [p.id, p.title])], f.post)}</select>
      <select id="af-status" aria-label="담당자 결정">${opts([["all", "담당자 결정 전체"], ...["검토 전", "합격", "보류", "불합격"].map(s => [s, s])], f.status)}</select>
      <input id="af-q" type="search" placeholder="이름 검색" value="${esc(f.q)}" aria-label="이름 검색">
      <span class="hint" id="af-count"></span>
    </div>
    <div class="card" style="padding:0"><div class="tblw"><table class="t">
      <thead><tr><th>이름</th><th>공고</th><th>응시일</th><th>면접 진행률</th><th class="num">AI 종합 점수</th><th>AI 예상 합격</th><th>담당자 결정</th><th>평가 리포트</th></tr></thead>
      <tbody id="atbody"></tbody></table></div></div>
    <p class="fine" style="margin:0">AI 예상 합격은 점수로 낸 참고값이고, 최종 합격 여부는 담당자 결정 칸에 담당자가 정한 값입니다.</p>`);
  const paint = () => {
    const list = BIZ.applicants.filter(a => (f.post === "all" || a.postId === +f.post) && (f.status === "all" || a.status === f.status) && a.name.includes(f.q.trim()));
    $("#af-count").textContent = `${list.length}명`;
    $("#atbody").innerHTML = list.length ? list.map(a => {
      const s = score(a);
      return `<tr class="click" data-id="${a.id}" tabindex="0"><td><b>${a.name}</b>${a.fresh ? ` <span class="badge">새 응시</span>` : ""}</td><td>${esc(postById(a.postId).title)}</td><td>${a.date}</td>
        <td><span class="mini"><span class="bar"><i style="width:${a.done / 5 * 100}%"></i></span>${a.done}/5${a.done < 5 ? " · 중단" : ""}</span></td>
        <td class="num">${s ?? "—"}</td><td>${s == null ? `<span class="hint">점수 없음</span>` : pill2(aiRec(s))}</td><td>${pill(a.status)}</td>
        <td><button class="btn btn-sm" data-rep="${a.id}" type="button"${a.done < 5 ? ` disabled title="면접을 끝까지 마치지 않아 리포트가 없습니다"` : ""}>리포트</button></td></tr>`;
    }).join("") : `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:28px">조건에 맞는 응시자가 없습니다</td></tr>`;
    $("#atbody").querySelectorAll("tr.click").forEach(tr => {
      const open = () => { state.appSel = +tr.dataset.id; render(); window.scrollTo(0, 0); };
      tr.addEventListener("click", open); tr.addEventListener("keydown", e => e.target === tr && e.key === "Enter" && open());
    });
    $("#atbody").querySelectorAll("[data-rep]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation(); const a = BIZ.applicants.find(x => x.id === +b.dataset.rep);
      go("report", { reportBack: "admin", reportName: a.name, postId: a.postId });
    }));
  };
  $("#af-post").addEventListener("change", e => { f.post = e.target.value; paint(); });
  $("#af-status").addEventListener("change", e => { f.status = e.target.value; paint(); });
  $("#af-q").addEventListener("input", e => { f.q = e.target.value; paint(); });
  paint();
}

function aApplicant(el) {
  const a = BIZ.applicants.find(x => x.id === state.appSel), p = postById(a.postId), rub = getR(a.postId).filter(c => c.w > 0), t = rub.reduce((x, c) => x + c.w, 0) || 1, s = score(a);
  const qs = makeQs(p), r = appResume(a);
  a.fresh = false;
  const ev = BIZ.schedule.filter(x => x.appId === a.id && x.d >= ymd(TODAY)).sort((x, y) => x.d.localeCompare(y.d))[0];
  el.insertAdjacentHTML("beforeend", `
    <button class="back" id="aback" type="button" style="margin:0">‹ 응시자 목록</button>
    <div class="card det-head">
      <span class="avatar">${a.name[0]}</span>
      <div><h1>${a.name}</h1><p>${esc(p.title)} · 10월 ${+a.date.slice(3)}일 응시 · 시선 경고 ${a.warn}회</p>
        ${ev ? `<p style="margin-top:6px"><span class="ev t-iv" style="display:inline-block">면접</span> ${md(ev.d)} ${ev.time} 2차 대면 면접 ${pill(ev.st || "확정")}</p>` : ""}</div>
      <div class="decide">
        <span class="dlabel">담당자 결정</span>
        ${["합격", "보류", "불합격"].map(x => `<button class="btn${a.status === x ? " on-" + pillCls[x] : ""}" data-dec="${x}" type="button" aria-pressed="${a.status === x}">${x}</button>`).join("")}
        <span class="vsep" aria-hidden="true"></span>
        <button class="btn" id="to-report" type="button"${a.done < 5 ? " disabled" : ""}>평가 리포트</button>
        <button class="btn btn-primary" id="mail-to" type="button">메일 보내기</button>
      </div>
    </div>
    <div class="grid2">
      <div class="card"><h2>이력서 <small>지원자가 올린 파일을 같은 양식으로 정리했습니다</small><button class="link" id="orig" type="button">원본 파일 보기</button></h2>
        <div class="rescard">
          <span class="rphoto" aria-label="증명사진 자리">${a.name[0]}</span>
          <dl><div><dt>이름</dt><dd>${a.name}</dd></div><div><dt>학력</dt><dd>${esc(r.edu)}</dd></div><div><dt>경력</dt><dd>${esc(r.career)}</dd></div>
            <div><dt>보유 기술</dt><dd>${esc(r.skills)}</dd></div><div><dt>주요 프로젝트</dt><dd>${esc(r.proj)}</dd></div></dl>
        </div>
        <div class="pinfo-b"><b>개인 정보 <span class="tag">표시 범위 논의 중</span></b>
          <dl><div><dt>생년월일</dt><dd>${r.birth}</dd></div><div><dt>연락처</dt><dd>${r.phone}</dd></div><div><dt>이메일</dt><dd>${r.email}</dd></div></dl></div>
      </div>
      <div class="card"><h2>평가 항목별 점수 <small>면접 질문 관리의 가중치 반영</small></h2>
        <div class="scores">${rub.map(c => { const v = critScore(c, a.id); return `<div class="srow"><span>${esc(c.name)}</span><span class="bar"><i style="width:${v}%"></i></span><b>${v}</b><small>가중치 ${Math.round(c.w / t * 100)}%</small></div>`; }).join("")}</div>
        <div class="total" style="margin-top:14px">${s == null ? `<span>면접을 끝까지 마치지 않아 종합 점수가 없습니다 (질문 ${a.done}/5)</span>` : `<span>AI 종합 점수</span><b style="font-size:20px">${s}점</b>`}</div>
        ${s == null ? "" : `<div class="airow" style="margin-top:14px"><b>AI 예상 합격</b>${pill2(aiRec(s))}<span class="hint">합격 추천 75점 이상 · 보류 65~74점 · 응시자에게는 보이지 않습니다</span></div>
        <ul class="aireasons">${aiReasons(s).map(([k, v]) => `<li><span>${k}</span>${v}</li>`).join("")}</ul>
        <p class="fine" style="margin:8px 0 0">AI 예상 합격은 참고용입니다. 합격 여부는 위의 담당자 결정 버튼으로 정합니다.</p>`}
      </div>
    </div>
    <div class="card"><h2>질문별 답변 <small>답변 영상과 텍스트 변환본</small></h2>
      <div class="ans">${qs.map((q, k) => `<div><b>Q${k + 1}. ${esc(q.q)}</b>${k < a.done ? `<p>${SAMPLE_ANS[k]} · ${a.cs[k]}점</p>` : `<p>답변하지 않음</p>`}${q.fu && k < a.done - 1 && q.fu !== GENERIC_FU ? `<b class="fuq">↳ 꼬리질문. ${esc(q.fu)}</b><p>${esc(((!isTech(p) && k === 2) ? REPORT_FU_BOARD : REPORT_FU[k + 1]).stt.slice(0, 60))}… · ${((!isTech(p) && k === 2) ? REPORT_FU_BOARD : REPORT_FU[k + 1]).score}점</p>` : ""}</div>`).join("")}</div>
    </div>
    <div class="card"><h2>메모 <small>우리 회사 담당자에게만 보입니다</small></h2>
      <div class="field"><textarea id="memo" aria-label="메모">${esc(a.memo)}</textarea></div>
      <div style="margin-top:10px"><button class="btn" id="save-memo" type="button">메모 저장</button></div>
    </div>`);
  $("#aback").addEventListener("click", () => { state.appSel = null; render(); });
  el.querySelectorAll("[data-dec]").forEach(b => b.addEventListener("click", () => { a.status = b.dataset.dec; toast(`${a.name}님을 ${a.status}(으)로 정했습니다`); render(); }));
  $("#to-report").addEventListener("click", () => go("report", { reportBack: "admin", reportName: a.name, postId: a.postId }));
  $("#save-memo").addEventListener("click", () => { a.memo = $("#memo").value; toast("메모를 저장했습니다"); });
  $("#mail-to").addEventListener("click", () => openMail(a, p));
  $("#orig").addEventListener("click", () => openModal(`${mhead(esc(r.file))}<div class="origf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg><b>${esc(r.file)}</b><span class="hint">지원자가 올린 원본 파일을 보여 주는 자리입니다 · PDF 2쪽</span></div>
    <div class="mfoot"><button class="btn" type="button" data-x>닫기</button><button class="btn btn-primary" type="button" id="dl">내려받기</button></div>`, m => m.querySelector("#dl").addEventListener("click", () => toast("원본 파일 내려받기 자리입니다"))));
}

const evRow = e => `<div${e.id ? ` data-ev="${e.id}" role="button" tabindex="0"` : ` data-ev=""`} class="evr"><span class="when">${md(e.d)}${e.time ? `<br>${e.time}` : ""}</span><span><span class="ev t-${e.type}" style="display:inline-block">${EV[e.type]}</span> ${esc(e.title)}${e.auto ? ` <span class="tag">자동</span>` : ""}${e.st ? ` ${pill(e.st)}` : ""}</span></div>`;

function aSchedule(el) {
  const c = state.cal ||= { y: 2026, m: 9 }, evs = allEvents();
  const first = new Date(c.y, c.m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); cells.push(d); if (i >= 34 && d.getMonth() !== c.m && d.getDay() === 6) break; }
  const monthEvs = evs.filter(e => e.d.startsWith(`${c.y}-${String(c.m + 1).padStart(2, "0")}`));
  const ed = state.evEdit && BIZ.schedule.find(e => e.id === state.evEdit);
  if (state.evEdit && !ed) state.evEdit = null;
  const f = ed || { d: ymd(TODAY), time: "14:00", type: "iv", title: "" };
  el.insertAdjacentHTML("beforeend", `
    <div class="ph"><div><h1>일정 관리</h1><p>공고 마감, 대면 면접, 결과 발표 일정을 한곳에서 관리합니다. 공고 마감일과 메일로 잡은 2차 면접은 자동으로 들어옵니다. 일정을 누르면 고칠 수 있습니다.</p></div>
      <div class="filters"><button class="arrow" id="cal-prev" type="button" aria-label="이전 달">‹</button><b>${c.y}년 ${c.m + 1}월</b><button class="arrow" id="cal-next" type="button" aria-label="다음 달">›</button><button class="btn" id="cal-today" type="button">오늘</button></div></div>
    <div class="filters">${Object.entries(EV).map(([k, l]) => `<span class="ev t-${k}" style="display:inline-block">${l}</span>`).join("")}<span class="tag">자동</span><span class="hint">공고 등록·메일 발송으로 자동 추가</span></div>
    <div class="layout2">
      <div class="card" style="padding:0"><div class="calw"><div class="cal">
        ${["일", "월", "화", "수", "목", "금", "토"].map(d => `<div class="dow">${d}</div>`).join("")}
        ${cells.map(d => { const k = ymd(d), list = evs.filter(e => e.d === k);
          return `<div class="${d.getMonth() !== c.m ? "out" : ""}${k === ymd(TODAY) ? " today" : ""}" data-day="${k}"><span class="d">${d.getDate()}</span>
            ${list.slice(0, 2).map(e => `<span class="ev t-${e.type}${e.id === state.evEdit ? " sel" : ""}${e.st === "수락 대기" ? " wait" : ""}" data-ev="${e.id || ""}" title="${esc(e.title)}${e.st ? " · " + e.st : ""}">${e.time ? e.time + " " : ""}${esc(e.title)}</span>`).join("")}${list.length > 2 ? `<span class="more">+${list.length - 2}개</span>` : ""}</div>`; }).join("")}
      </div></div></div>
      <div style="display:grid;gap:16px">
        <div class="card" id="ev-card"><h2>${ed ? "일정 수정" : "일정 추가"} <small>${ed ? (ed.auto ? "자동으로 들어온 일정입니다" : "") : "달력의 날짜를 누르면 날짜가 채워집니다"}</small></h2>
          <form class="form" id="ev-f">
            <div class="row2"><div class="field"><label for="ev-d">날짜</label><input id="ev-d" type="date" value="${f.d}" required></div>
              <div class="field"><label for="ev-t">시간</label><input id="ev-t" type="time" value="${f.time}"></div></div>
            <div class="field"><label for="ev-type">종류</label><select id="ev-type">${Object.entries(EV).filter(([k]) => k !== "post").map(([k, l]) => `<option value="${k}"${k === f.type ? " selected" : ""}>${l}</option>`).join("")}</select></div>
            <div class="field"><label for="ev-title">내용</label><input id="ev-title" placeholder="예: 박서연 2차 대면 면접" value="${esc(f.title)}" required></div>
            ${ed?.st ? `<p class="hint" style="margin:0">지원자 응답: ${pill(ed.st)}${ed.st === "수락" ? " · 시간을 바꾸면 지원자에게 변경 메일이 발송됩니다" : ""}</p>` : ""}
            ${ed ? (state.evDel ? `<div class="confirm"><span>이 일정을 삭제하시겠습니까?</span><button class="btn btn-danger" id="ev-del-ok" type="button">삭제</button><button class="btn" id="ev-del-x" type="button">취소</button></div>`
              : `<div class="btnrow"><button class="btn btn-primary" type="submit">수정 저장</button><button class="btn" id="ev-cancel" type="button">취소</button><button class="btn danger-t" id="ev-del" type="button">삭제</button></div>`)
              : `<button class="btn btn-primary" type="submit">일정 추가</button>`}
          </form></div>
        <div class="card"><h2>${c.m + 1}월 일정 <small>${monthEvs.length}건</small></h2><div class="evlist">${monthEvs.map(evRow).join("") || `<span class="hint">이 달에는 일정이 없습니다</span>`}</div></div>
      </div>
    </div>`);
  const mv = n => { c.m += n; if (c.m < 0) { c.m = 11; c.y--; } if (c.m > 11) { c.m = 0; c.y++; } render(); };
  const edit = id => {
    if (!id) return toast("공고 마감일은 공고 관리에서 공고를 수정하면 바뀝니다");

  el.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => { state.pEdit = +b.dataset.edit; render(); window.scrollTo(0, 0); }));

  el.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => { const p = P(b.dataset.close); p.status = "마감"; logHist("마감", p.title, "담당자가 마감"); toast("공고를 마감했습니다. 메인 화면에서 내려갑니다"); render(); }));
  el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { state.pDel = +b.dataset.del; render(); }));
  el.querySelectorAll("[data-del-x]").forEach(b => b.addEventListener("click", () => { state.pDel = null; render(); }));
  el.querySelectorAll("[data-del-ok]").forEach(b => b.addEventListener("click", () => { const p = P(b.dataset.delOk); delPost(p); state.pDel = null; toast(`「${p.title}」 공고를 삭제했습니다`); render(); }));
  $("#h-more")?.addEventListener("click", () => { state.histAll = !state.histAll; render(); });
}

function aPostForm(el) {
  const isNew = state.pEdit === "new";
  const p = isNew ? { title: "", cat: "개발", career: "신입", type: "정규직", loc: "서울 강남", hc: 1, dday: 30, duties: [], reqs: [], prefs: [] } : postById(state.pEdit);

        <div class="row2"><div class="field"><label for="pf-type">고용형태</label><input id="pf-type" value="${esc(p.type)}"></div>
          <div class="field"><label for="pf-loc">근무지</label><input id="pf-loc" value="${esc(p.loc)}"></div></div>
        <div class="row2"><div class="field"><label for="pf-hc">모집 인원</label><input id="pf-hc" type="number" min="1" max="99" value="${p.hc || 1}"></div>

        <div class="field"><label for="pf-reqs">자격 요건</label><textarea id="pf-reqs">${esc(p.reqs.join("\n"))}</textarea></div>
        <div class="field"><label for="pf-prefs">우대 사항</label><textarea id="pf-prefs">${esc(p.prefs.join("\n"))}</textarea></div>
        <div class="field"><label for="pf-img">공고 이미지 <span class="hint">4:5 비율 권장, 없으면 기본 디자인으로 만들어집니다</span></label><input id="pf-img" type="file" accept="image/*"></div>
        ${!state.verified ? `<div class="notice" style="margin:0">기업 인증이 승인되면 게시할 수 있습니다. 지금은 임시 저장만 됩니다.</div>` : ""}
        <div class="btnrow" id="pf-btns">

          ${isNew ? "" : `<button class="btn danger-t" id="pf-del" type="button">삭제</button>`}
          <button class="btn btn-primary" type="submit" style="margin-left:auto"${state.verified ? "" : " disabled"}>${!isNew && p.status === "게시 중" ? "수정 내용 게시" : "게시하기"}</button></div>
        <div id="pf-confirm"></div>
      </form>
      <div class="card"><h2>썸네일 <small>메인 화면 목록에 이렇게 보입니다</small></h2><div id="pf-prev"></div>
        <p class="fine">상세 화면 전체는 '미리보기'로 확인합니다.</p></div>
    </div>`);
  const read = () => {
    const lines = id => $(id).value.split("\n").map(x => x.trim()).filter(Boolean);
    const days = Math.max(0, Math.round((new Date($("#pf-end").value) - new Date(ymd(TODAY))) / 864e5));
    return { title: $("#pf-title").value.trim() || "제목 없는 공고", cat: $("#pf-cat").value, career: $("#pf-career").value, type: $("#pf-type").value, loc: $("#pf-loc").value,
      hc: Math.max(1, +$("#pf-hc").value || 1), dday: days, duties: lines("#pf-duties"), reqs: lines("#pf-reqs"), prefs: lines("#pf-prefs") };
  };
  const fill = d => {
    [["title", "title"], ["career", "career"], ["type", "type"], ["loc", "loc"], ["hc", "hc"]].forEach(([k, f]) => { if (d[f] != null) $("#pf-" + k).value = d[f]; });
    if (d.cat) $("#pf-cat").value = d.cat;
    ["duties", "reqs", "prefs"].forEach(k => { if (d[k]) $("#pf-" + k).value = d[k].join("\n"); });
    prev();
  };
  const prev = () => { $("#pf-prev").innerHTML = `<div style="max-width:240px">${poster({ company: COMPANY, logo: "N", color: "#1f5fa8", ...read() })}</div>`; };
  $("#pf").addEventListener("input", prev); prev();
  $("#pf-title").addEventListener("input", e => { if (e.target.value.trim()) { const er = $('[data-err="pf-title"]'); if (er) er.textContent = ""; e.target.removeAttribute("aria-invalid"); } });
  const save = status => {
    const d = read();
    if (status === "게시 중" && !check($("#pf"), [["pf-title", need("공고 제목")]])) return;
    if (!d.duties.length) d.duties = ["(주요 업무를 입력해 주십시오)"];
    if (!d.reqs.length) d.reqs = ["(자격 요건을 입력해 주십시오)"];
    const was = p.status;
    let t = isNew ? { id: Date.now(), company: COMPANY, logo: "N", color: "#1f5fa8", q: ["인성", "직무 기술", "프로젝트 경험"], views: 0, applicants: 0, avg: null } : p;
    Object.assign(t, d, { status });
    if (isNew) BIZ.posts.unshift(t);
    if (status === "게시 중" && !POSTS.includes(t)) POSTS.unshift(t);
    logHist(status === "작성 중" ? (isNew ? "작성" : "수정") : was === "게시 중" ? "수정" : status === "게시 중" ? "게시" : "수정", t.title, status === "작성 중" ? "임시 저장" : status === "게시 중" && was !== "게시 중" ? `마감일 ${md(ymd(addDays(t.dday)))} 일정 관리에 자동 추가` : "");
    state.pEdit = null;
    toast(status === "게시 중" ? "공고를 게시했습니다. 메인 화면과 일정 관리에 바로 들어갑니다" : "임시 저장했습니다");
    render();
  };
  $("#pback").addEventListener("click", () => { state.pEdit = null; render(); });
  $("#pf-tpl").addEventListener("click", () => openTpl(fill));
  $("#pf-pv").addEventListener("click", () => previewPost({ ...(isNew ? {} : { id: p.id }), ...read() }));
  $("#pf-save-tpl").addEventListener("click", () => {
    const d = read();
    openModal(`${mhead("템플릿으로 저장")}<form class="form" id="tf" novalidate><div class="field"><label for="tf-name">템플릿 이름</label><input id="tf-name" value="${esc(d.cat)} 직군 · ${esc(d.title)}"></div>
      <p class="hint" style="margin:0">제목, 직무, 경력, 고용형태, 근무지, 모집 인원, 업무·요건·우대 사항을 저장합니다. 마감일은 저장하지 않습니다.</p>
      <div class="mfoot"><button class="btn" type="button" data-x>취소</button><button class="btn btn-primary" type="submit">저장</button></div></form>`, m => {
      m.querySelector("#tf").addEventListener("submit", e => {
        e.preventDefault(); if (!check(m, [["tf-name", need("템플릿 이름")]])) return;
        BIZ.tpls.unshift({ name: m.querySelector("#tf-name").value.trim(), ...d }); closeModal(); toast("템플릿으로 저장했습니다. '템플릿 불러오기'에서 쓸 수 있습니다");
      });
    });
  });
  $("#pf-del")?.addEventListener("click", () => {
    $("#pf-btns").hidden = true;
    $("#pf-confirm").innerHTML = `<div class="confirm"><span>이 공고를 삭제하시겠습니까? 지원자 화면에서 바로 사라지고 되돌릴 수 없습니다.${p.applicants ? ` 응시자 ${p.applicants}명의 결과는 응시자 목록에 남습니다.` : ""}</span><button class="btn btn-danger" id="pf-del-ok" type="button">삭제</button><button class="btn" id="pf-del-x" type="button">취소</button></div>`;
    $("#pf-del-ok").addEventListener("click", () => { delPost(p); state.pEdit = null; toast(`「${p.title}」 공고를 삭제했습니다`); render(); });
    $("#pf-del-x").addEventListener("click", () => { $("#pf-confirm").innerHTML = ""; $("#pf-btns").hidden = false; });
  });
  $("#pf-draft").addEventListener("click", () => save(isNew || p.status === "작성 중" ? "작성 중" : p.status));
  $("#pf").addEventListener("submit", e => { e.preventDefault(); save("게시 중"); });
}

function aInbox(el) {

  el.insertAdjacentHTML("beforeend", `
    <div class="ph"><div><h1>문의 쪽지</h1><p>응시자와 운영팀이 보낸 문의를 확인하고 답장합니다.</p></div></div>
    <div class="inbox">
      <div class="threads">${BIZ.inbox.map(t => `<button class="th" type="button" data-th="${t.id}" aria-current="${t.id === th.id}">
        <b>${t.unread ? `<span class="dot-un" aria-label="읽지 않음"></span>` : ""}${esc(t.who)} <span class="pill none">${t.kind}</span></b><span>${esc(t.subject)}</span></button>`).join("")}</div>
      <div class="conv">
        <div class="conv-h"><b>${esc(th.subject)}</b><small>${esc(th.who)} · ${th.kind}</small></div>
        <div class="msgs">${th.msgs.map(m => `<div class="msg${m.me ? " me" : ""}">${esc(m.text)}<small>${m.me ? "나" : esc(th.who)} · ${m.at}</small></div>`).join("") || `<span class="hint">아직 주고받은 쪽지가 없습니다. 첫 쪽지를 보내 보십시오.</span>`}</div>
        <form class="reply" id="rp"><textarea id="rp-text" placeholder="답장을 입력하십시오" aria-label="답장" required></textarea><button class="btn btn-primary" type="submit">보내기</button></form>
      </div>
    </div>`);
  if (wasUnread) { const c = view.querySelector('.nav[data-tab="inbox"] .cnt'); const n = BIZ.inbox.filter(t => t.unread).length; if (c) n ? (c.textContent = n) : c.remove(); }

  $("#rp").addEventListener("submit", e => { e.preventDefault(); th.msgs.push({ me: true, text: $("#rp-text").value.trim(), at: "10.19 16:40" }); toast("쪽지를 보냈습니다"); render(); });

/* ---------- 운영자 ---------- */
function renderOps() {
  if (state.role !== "ops") return go("main");
  const tab = state.opsTab || "verify";
  view.innerHTML = shellHTML(OPS_TABS, tab, "운영자", "플랫폼 운영", { verify: OPS.reqs.filter(r => r.status === "검토 필요").length });
  view.querySelectorAll(".nav").forEach(b => b.addEventListener("click", () => { state.opsTab = b.dataset.tab; render(); }));
  (tab === "verify" ? oVerify : oPosts)($("#panel"));
}

function oVerify(el) {
  const order = { "검토 필요": 0, "반려": 2 };
  const list = [...OPS.reqs].sort((a, b) => (order[a.status] ?? 1) - (order[b.status] ?? 1));
  const cnt = s => OPS.reqs.filter(r => r.status === s).length;
  el.insertAdjacentHTML("beforeend", `
    <div class="ph"><div><h1>기업 인증</h1><p>회사 메일로 인증한 기업은 자동 승인됩니다. 개인 메일로 가입한 기업만 증빙을 보고 승인해 주십시오.</p></div></div>
    <div class="filters">${["검토 필요", "자동 승인", "승인", "반려"].map(s => `${pill(s)} <span class="hint">${cnt(s)}건</span>`).join("&nbsp;&nbsp;")}</div>
    <div class="card" style="padding:0"><div class="tblw"><table class="t">
      <thead><tr><th>회사</th><th>담당자</th><th>이메일</th><th>사업자등록번호</th><th>확인 방법</th><th>증빙</th><th>신청일</th><th>상태</th><th>처리</th></tr></thead>
      <tbody>${list.map(r => `<tr><td><b>${esc(r.company)}</b>${r.me ? ` <span class="badge">지금 시연 중인 계정</span>` : ""}</td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.biz)}</td><td>${r.method}</td>
        <td>${r.file ? `<button class="link" data-file type="button">${esc(r.file)}</button>` : "—"}</td><td>${r.at}</td><td>${pill(r.status)}</td>
        <td>${r.status === "검토 필요" ? (r.rejecting
          ? `<div class="inline"><input id="rj-${r.id}" placeholder="반려 사유 (기업에 쪽지로 전달됩니다)" aria-label="반려 사유"><button class="btn" data-rj-ok="${r.id}" type="button">반려 확정</button><button class="btn" data-rj-x="${r.id}" type="button">취소</button></div>`
          : `<div style="display:flex;gap:6px"><button class="btn btn-primary" data-ok="${r.id}" type="button">승인</button><button class="btn" data-rj="${r.id}" type="button">반려</button></div>`)
          : r.status === "반려" ? `<span class="hint" style="white-space:normal;display:block;min-width:180px">${esc(r.reason || "")}</span>` : "—"}</td></tr>`).join("")}</tbody>
    </table></div></div>`);
  const R = id => OPS.reqs.find(r => r.id === +id);
  el.querySelectorAll("[data-file]").forEach(b => b.addEventListener("click", () => toast("증빙 파일 미리보기 자리입니다")));
  el.querySelectorAll("[data-ok]").forEach(b => b.addEventListener("click", () => { const r = R(b.dataset.ok); r.status = "승인"; if (r.me) state.verified = true; toast(`${r.company} 기업회원을 승인했습니다`); render(); }));
  el.querySelectorAll("[data-rj]").forEach(b => b.addEventListener("click", () => { R(b.dataset.rj).rejecting = true; render(); $("#rj-" + b.dataset.rj)?.focus(); }));
  el.querySelectorAll("[data-rj-x]").forEach(b => b.addEventListener("click", () => { R(b.dataset.rjX).rejecting = false; render(); }));
  el.querySelectorAll("[data-rj-ok]").forEach(b => b.addEventListener("click", () => {
    const r = R(b.dataset.rjOk), why = $("#rj-" + r.id).value.trim();
    if (!why) return toast("반려 사유를 입력해 주십시오");
    Object.assign(r, { status: "반려", reason: why, rejecting: false }); toast(`${r.company} 신청을 반려했습니다`); render();
  }));
}

function oPosts(el) {
  const rows = POSTS.map(p => {
    const sus = OPS.suspended.has(p.company), st = p.hidden || sus ? "숨김" : p.status || "게시 중";
    return `<tr><td><b>${esc(p.title)}</b></td><td>${esc(p.company)}${sus ? ` <span class="pill bad">정지</span>` : ""}</td><td>${p.cat}</td><td>${pill(st)}</td>
      <td class="num">${OPS.reports[p.id] ? `<b style="color:var(--bad-ink)">${OPS.reports[p.id]}건</b>` : "0건"}</td>
      <td><div style="display:flex;gap:6px"><button class="btn" data-hide="${p.id}" type="button">${p.hidden ? "다시 보이기" : "숨기기"}</button>
        <button class="btn" data-sus="${esc(p.company)}" type="button">${sus ? "기업 정지 해제" : "기업 정지"}</button></div></td></tr>`;
  }).join("");
  el.insertAdjacentHTML("beforeend", `
    <div class="ph"><div><h1>공고 관리</h1><p>신고되거나 문제가 있는 공고를 숨기고, 필요하면 기업회원을 정지합니다. 숨긴 공고는 메인 화면에서 바로 사라집니다.</p></div></div>
    <div class="card" style="padding:0"><div class="tblw"><table class="t">
      <thead><tr><th>공고</th><th>회사</th><th>직무</th><th>상태</th><th class="num">신고</th><th>관리</th></tr></thead><tbody>${rows}</tbody>
    </table></div></div>`);
  el.querySelectorAll("[data-hide]").forEach(b => b.addEventListener("click", () => { const p = POSTS.find(x => x.id === +b.dataset.hide); p.hidden = !p.hidden; toast(p.hidden ? "공고를 숨겼습니다" : "공고를 다시 보이게 했습니다"); render(); }));

  const v = e.target.value;
  Object.assign(state, {
    out: { loggedIn: false, role: null },
    seeker: { loggedIn: true, role: "seeker", user: state.profile.name },
    pending: { loggedIn: true, role: "recruiter", verified: false, user: "박지훈" },
    approved: { loggedIn: true, role: "recruiter", verified: true, user: "박지훈" },
    ops: { loggedIn: true, role: "ops", user: "운영팀" }
  }[v]);
  syncMeReq();
  if (v === "pending" || v === "approved") go("admin");
  else if (v === "ops") go("ops");
  else if (["login", "bizsignup", "admin", "ops"].includes(state.view)) go("main", { pending: null, notice: null });
  else render();
});
$("#tog-resume").addEventListener("click", () => { state.hasResume = !state.hasResume; render(); });
$("#reset").addEventListener("click", () => { Object.assign(state, { loggedIn: false, role: null, verified: false, hasResume: false, user: "김지원", cat: "전체", pending: null, notice: null, adminTab: "dash", opsTab: "verify", appSel: null, pEdit: null }); go("main"); });
render();
</script>

</body></html>
