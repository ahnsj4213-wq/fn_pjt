[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aihire-backend"
version = "0.1.0"
description = "On-premise AI recruiting platform: API, worker and AI service"
requires-python = ">=3.12,<3.13"
# Versions are pinned to what was installed and verified on the 6GB dev box (docs/trd/02-technology-decisions.md).
dependencies = [
  "fastapi==0.162.0",            # MIT
  "uvicorn[standard]==0.54.0",   # BSD-3
  "sqlalchemy[asyncio]==2.0.55", # MIT
  "asyncpg==0.32.0",             # Apache-2.0
  "alembic==1.20.1",             # MIT
  "pydantic==2.14.1",            # MIT
  "pydantic-settings==2.16.1",   # MIT
  "argon2-cffi==25.1.0",         # MIT
  "pypdf==6.21.2",               # BSD-3
  "pypdfium2==5.14.0",           # BSD-3 / Apache-2.0; renders scanned resume pages for OCR (RES-04)
  "pillow==13.0.0",              # MIT-CMU; OCR image handling (deskew, EXIF rotation)
  "pytesseract==0.3.13",         # Apache-2.0; Tesseract wrapper (binary + kor data in the worker image)
  "python-multipart==0.0.32",    # Apache-2.0
  "httpx==0.28.1",               # BSD-3
  "aiortc==1.15.0",              # BSD-3 (WebRTC)
  "av==17.1.0",                  # BSD-3, bundles LGPL FFmpeg
  "numpy==2.5.4",                # BSD-3
  "soundfile==0.14.0",           # BSD-3
  "redis==6.4.0",                # MIT (job dispatch + real-time events, ADR-0013)
  "minio==7.2.20",               # Apache-2.0 (S3/MinIO file storage client)
  "pgvector==0.5.1",             # MIT (question-bank embeddings, migration 0004)
  "celery[redis]==5.6.3",        # BSD-3 (worker + beat in the container stack, ADR-0014)
  "langgraph==1.2.19",           # MIT; interview progress graph (ADR-0016). Runs locally, no remote call
  "langgraph-checkpoint-postgres==3.2.0",  # MIT; the graph's checkpoints live in our PostgreSQL
  "psycopg[binary,pool]==3.3.7", # LGPL-3.0 (dynamic use as a library); the checkpointer's driver, the app itself stays on asyncpg
]

[project.optional-dependencies]
# Heavy model runtimes live only in the AI service process.
ai = [
  "faster-whisper==1.2.1",       # MIT
  "ctranslate2==4.8.4",          # MIT
  "onnxruntime==1.31.0",         # MIT
  "supertonic==1.3.1",           # MIT code; model weights OpenRAIL-M (legal review: docs/open-questions.md)
  # Windows GPU STT: CUDA 12 cuBLAS/cuDNN 9 DLLs for ctranslate2 (app.aisvc.speech puts their bin folders on PATH)
  "nvidia-cublas-cu12; sys_platform == 'win32'",
  "nvidia-cudnn-cu12==9.*; sys_platform == 'win32'",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "reportlab==5.1.0",            # BSD; builds test PDF fixtures locally
  "moto[server]==5.2.5",           # Apache-2.0; S3 server for storage tests
  "aiosmtpd==1.4.6",             # Apache-2.0; SMTP sink for mail tests
  "openpyxl==3.1.5",             # MIT; scripts/build_question_examples.py reads the team question spreadsheets
]

[tool.setuptools.packages.find]
# Only the application package is installed; migrations/ and tests/ run from the source tree.
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL (dev compose)",
  "docker: needs the Docker daemon (sandbox)",
  "models: needs local AI models (Ollama/Whisper/Supertonic)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
